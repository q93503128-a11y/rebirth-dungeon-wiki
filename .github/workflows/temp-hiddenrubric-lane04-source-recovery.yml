name: TEMP HiddenRubric Lane04 Source Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-source-recovery.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover known LMArena rows without retaining model outputs
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, hashlib

          DATASET='lmarena-ai/arena-human-preference-140k'
          CONFIG='default'
          SPLIT='train'
          TARGETS=[
              ('ac3bba5f-a55e-49ef-a83a-e54892c849bb',0,'Senior Management','approval_from_actor'),
              ('8c02f215-e1db-48e2-8de8-543ed61bb5b7',0,'senior management','review_by_actor'),
              ('baacddce-6b47-468a-a812-fa3c77590116',7,'evaluating committee','evaluate_by_actor'),
              ('8b1cfa16-9c5d-477a-a321-79a214d7aaae',0,'Module Team','grade_by_actor'),
              ('9e88b8ad-fa51-4276-9571-53ddde8e86f5',1,'teacher marker','grade_by_actor'),
              ('e2848d8e-ee40-44b0-b83c-ce0b1f239a88',0,'schools','approval_from_actor'),
              ('6a1c9bf5-d756-45fe-8a30-db80bac937ed',0,'Selection Committee','evaluate_by_actor'),
          ]

          def text_of(msg):
              if not isinstance(msg,dict): return ''
              c=msg.get('content')
              if isinstance(c,str): return c
              if isinstance(c,list):
                  out=[]
                  for item in c:
                      if isinstance(item,str): out.append(item)
                      elif isinstance(item,dict) and isinstance(item.get('text'),str): out.append(item['text'])
                  return '\n'.join(x for x in out if x)
              if isinstance(msg.get('text'),str): return msg['text']
              return ''

          def user_turns(full):
              out=[]
              for entry in full or []:
                  if not isinstance(entry,dict): continue
                  user=entry.get('user')
                  if isinstance(user,dict):
                      t=text_of(user).strip()
                      if t: out.append(t)
                  elif entry.get('role')=='user':
                      t=text_of(entry).strip()
                      if t: out.append(t)
              return out

          recovered=[]
          for source_id, turn_index, actor, relation in TARGETS:
              q=urllib.parse.urlencode({
                  'dataset':DATASET,'config':CONFIG,'split':SPLIT,
                  'where':f'"id"=\'{source_id}\'','offset':0,'length':2,
              })
              url='https://datasets-server.huggingface.co/filter?'+q
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'hiddenrubric-lane04-recovery/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  payload=json.load(r)
              rows=payload.get('rows') or []
              if len(rows)!=1:
                  recovered.append({'sourceRowId':source_id,'status':'unresolved','reason':f'expected_one_row_got_{len(rows)}'})
                  continue
              wrapper=rows[0]
              row=wrapper.get('row') or {}
              turns=user_turns(row.get('full_conversation'))
              if row.get('id')!=source_id:
                  recovered.append({'sourceRowId':source_id,'status':'unresolved','reason':'id_mismatch'})
                  continue
              if not isinstance(row.get('evaluation_session_id'),str) or not row['evaluation_session_id']:
                  recovered.append({'sourceRowId':source_id,'status':'unresolved','reason':'missing_evaluation_session_id'})
                  continue
              if not (0 <= turn_index < len(turns)):
                  recovered.append({'sourceRowId':source_id,'status':'unresolved','reason':'turn_index_out_of_range','userTurnCount':len(turns)})
                  continue
              source=turns[turn_index]
              recovered.append({
                  'sourceDataset':DATASET,
                  'sourceRowId':source_id,
                  'sourceEvaluationSessionId':row['evaluation_session_id'],
                  'rowIndex':wrapper.get('row_idx'),
                  'turnIndex':turn_index,
                  'actorHint':actor,
                  'relationHint':relation,
                  'source_en':source,
                  'sourceSha256':hashlib.sha256(source.encode()).hexdigest(),
                  'userTurnCount':len(turns),
                  'assistantOutputsIncluded':False,
                  'status':'source-recovered',
                  'trainingEligible':False,
              })

          out={'schemaVersion':'router-stage05-lane04-known-source-recovery-v1','sourceRevision':'a9cb587ee0906192dc1fc5e51778282f36c6bf35','rows':recovered}
          path='/tmp/lane04-known-source-recovery.json'
          with open(path,'w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps({'rows':len(recovered),'resolved':sum(r.get('status')=='source-recovered' for r in recovered)},ensure_ascii=False))
          PY
      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: lane04-known-source-recovery
          path: /tmp/lane04-known-source-recovery.json
          if-no-files-found: error
          retention-days: 1
