name: Living Kingdoms temporary build

on:
  push:
    branches:
      - lk-build-v0.18.0-neoforge-38
    paths:
      - lkbuild/READY
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_DIR: living-kingdoms-neoforge-26.2-v0.18.0
  OUTPUT_JAR: Living-Kingdoms-v0.18.0-mc26.2-neoforge-26.2.0.38-beta.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lk-build-v0.18.0-neoforge-38

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR" lkbuild/result
          mkdir -p lkbuild/result
          cat lkbuild/chunks/part-* | base64 --decode > lkbuild/source.tar.xz
          printf '%s  %s\n' 'a1bac9fad9c78e8eefbaf3d02e81c5ceea2fab3a0d90eda462650c7642c427b6' 'lkbuild/source.tar.xz' | sha256sum --check
          tar -xJf lkbuild/source.tar.xz
          test -f "$PROJECT_DIR/build.gradle"
          if [ -d lkbuild/overrides ]; then
            cp -a lkbuild/overrides/. "$PROJECT_DIR"/
          fi

      - name: Build NeoForge mod
        id: build
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          gradle clean build --stacktrace --no-daemon > ../lkbuild/result/build.log 2>&1
          code=$?
          cd ..
          printf '%s\n' "$code" > lkbuild/result/build.exit
          exit 0

      - name: Select runnable JAR
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat lkbuild/result/build.exit)"
          if [ "$code" != '0' ]; then
            exit 0
          fi
          mapfile -t jars < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' ! -name '*dev*' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one runnable JAR, found %s\n' "${#jars[@]}" | tee -a lkbuild/result/build.log
            printf '%s\n' "${jars[@]}" | tee -a lkbuild/result/build.log
            printf '90\n' > lkbuild/result/build.exit
            exit 0
          fi
          cp "${jars[0]}" "lkbuild/result/$OUTPUT_JAR"
          sha256sum "lkbuild/result/$OUTPUT_JAR" > lkbuild/result/Living-Kingdoms-v0.18.0.sha256
          unzip -l "lkbuild/result/$OUTPUT_JAR" > lkbuild/result/jar-contents.txt
          if ! grep -F 'META-INF/neoforge.mods.toml' lkbuild/result/jar-contents.txt; then
            printf '91\n' > lkbuild/result/build.exit
          fi

      - name: Upload build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-v0.18.0-build-result
          path: lkbuild/result
          if-no-files-found: error
          retention-days: 7

      - name: Fail when compilation failed
        if: always()
        shell: bash
        run: |
          code="$(cat lkbuild/result/build.exit 2>/dev/null || printf '99')"
          if [ "$code" != '0' ]; then
            printf 'NeoForge build failed with exit code %s\n' "$code"
            exit "$code"
          fi
