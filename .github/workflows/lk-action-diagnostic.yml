name: LK Action Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "GitHub Actions works" > diagnostic.txt
          uname -a >> diagnostic.txt
          java -version 2>> diagnostic.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: lk-action-diagnostic
          path: diagnostic.txt
