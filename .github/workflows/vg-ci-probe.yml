name: Build Village Guardians v0.8.0

on:
  push:
    branches:
      - build/village-guardians-ci-probe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate minimal first-playable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vg-build
          mkdir -p vg-build/src/main/java/kr/moonseungjun/villageguardians
          mkdir -p vg-build/src/main/templates/META-INF

          cat > vg-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
              }
          }
          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
          }
          rootProject.name = 'VillageGuardians-26.2'
          EOF

          cat > vg-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          minecraft_version=26.2
          minecraft_version_range=[26.2]
          loader_version_range=[1,)
          neo_version=26.2.0.38-beta
          neo_version_range=[26.2,)
          mod_id=villageguardians
          mod_name=Village Guardians
          mod_license=All Rights Reserved
          mod_version=0.8.0-alpha.1
          mod_group_id=kr.moonseungjun.villageguardians
          EOF

          cat > vg-build/build.gradle <<'EOF'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '2.0.143'
          }

          version = mod_version
          group = mod_group_id

          base {
              archivesName = 'VillageGuardians-26.2'
          }

          repositories {
              mavenCentral()
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          neoForge {
              version = project.neo_version
              mods {
                  "${mod_id}" {
                      sourceSet(sourceSets.main)
                  }
              }
          }

          var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
              var replaceProperties = [
                      minecraft_version       : minecraft_version,
                      minecraft_version_range : minecraft_version_range,
                      loader_version_range    : loader_version_range,
                      neo_version             : neo_version,
                      neo_version_range       : neo_version_range,
                      mod_id                  : mod_id,
                      mod_name                : mod_name,
                      mod_license             : mod_license,
                      mod_version             : mod_version
              ]
              inputs.properties replaceProperties
              expand replaceProperties
              from 'src/main/templates'
              into 'build/generated/sources/modMetadata'
          }
          sourceSets.main.resources.srcDir generateModMetadata
          neoForge.ideSyncTask generateModMetadata

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

          cat > vg-build/src/main/templates/META-INF/neoforge.mods.toml <<'EOF'
          modLoader="javafml"
          loaderVersion="${loader_version_range}"
          license="${mod_license}"

          [[mods]]
          modId="${mod_id}"
          version="${mod_version}"
          displayName="마을 지키기"
          authors="문승준 프로젝트"
          description='''
          마을을 준비하고 밤의 침공을 막는 협동 마을 방어 게임의 첫 플레이 알파입니다.
          '''

          [[dependencies.${mod_id}]]
          modId="neoforge"
          type="required"
          versionRange="${neo_version_range}"
          ordering="NONE"
          side="BOTH"

          [[dependencies.${mod_id}]]
          modId="minecraft"
          type="required"
          versionRange="${minecraft_version_range}"
          ordering="NONE"
          side="BOTH"
          EOF

          cat > vg-build/src/main/java/kr/moonseungjun/villageguardians/VillageGuardians.java <<'EOF'
          package kr.moonseungjun.villageguardians;

          import com.mojang.logging.LogUtils;
          import net.neoforged.fml.common.Mod;
          import org.slf4j.Logger;

          @Mod(VillageGuardians.MOD_ID)
          public final class VillageGuardians {
              public static final String MOD_ID = "villageguardians";
              private static final Logger LOGGER = LogUtils.getLogger();

              public VillageGuardians() {
                  LOGGER.info("Village Guardians 26.2 v0.8.0 First Playable Alpha loaded");
              }
          }
          EOF

      - name: Compile and capture log
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd vg-build
          gradle --no-daemon --stacktrace --console=plain clean build > "$GITHUB_WORKSPACE/build.log" 2>&1
          CODE=$?
          echo "$CODE" > "$GITHUB_WORKSPACE/build.exit"
          cat "$GITHUB_WORKSPACE/build.log"
          exit "$CODE"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vg-diagnostics
          path: |
            build.log
            build.exit
          if-no-files-found: warn

      - name: Collect distributable JAR
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifact
          JAR="$(find vg-build/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" artifact/VillageGuardians-26.2-v0.8.0-alpha.1.jar
          sha256sum artifact/VillageGuardians-26.2-v0.8.0-alpha.1.jar > artifact/VillageGuardians-26.2-v0.8.0-alpha.1.jar.sha256

      - name: Upload JAR
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VillageGuardians-26.2-v0.8.0-alpha.1
          path: artifact/*
          if-no-files-found: error

      - name: Fail when compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1
