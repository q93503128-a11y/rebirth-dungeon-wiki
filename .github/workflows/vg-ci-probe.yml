name: Build Village Guardians v0.8.0

on:
  push:
    branches:
      - build/village-guardians-ci-probe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate first-playable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vg-build
          mkdir -p vg-build/src/main/java/kr/moonseungjun/villageguardians
          mkdir -p vg-build/src/main/templates/META-INF
          mkdir -p vg-build/src/main/resources/data/minecraft/tags/function
          mkdir -p vg-build/src/main/resources/data/villageguardians/function

          cat > vg-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories { gradlePluginPortal() }
          }
          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
          }
          rootProject.name = 'VillageGuardians-26.2'
          EOF

          cat > vg-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          minecraft_version=26.2
          minecraft_version_range=[26.2]
          loader_version_range=[1,)
          neo_version=26.2.0.38-beta
          neo_version_range=[26.2,)
          mod_id=villageguardians
          mod_name=Village Guardians
          mod_license=All Rights Reserved
          mod_version=0.8.0-alpha.1
          mod_group_id=kr.moonseungjun.villageguardians
          EOF

          cat > vg-build/build.gradle <<'EOF'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '2.0.143'
          }
          version = mod_version
          group = mod_group_id
          base { archivesName = 'VillageGuardians-26.2' }
          repositories { mavenCentral() }
          java.toolchain.languageVersion = JavaLanguageVersion.of(25)
          neoForge {
              version = project.neo_version
              mods {
                  "${mod_id}" { sourceSet(sourceSets.main) }
              }
          }
          var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
              var replaceProperties = [
                  minecraft_version:minecraft_version,
                  minecraft_version_range:minecraft_version_range,
                  loader_version_range:loader_version_range,
                  neo_version:neo_version,
                  neo_version_range:neo_version_range,
                  mod_id:mod_id,
                  mod_name:mod_name,
                  mod_license:mod_license,
                  mod_version:mod_version
              ]
              inputs.properties replaceProperties
              expand replaceProperties
              from 'src/main/templates'
              into 'build/generated/sources/modMetadata'
          }
          sourceSets.main.resources.srcDir generateModMetadata
          neoForge.ideSyncTask generateModMetadata
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF

          cat > vg-build/src/main/templates/META-INF/neoforge.mods.toml <<'EOF'
          modLoader="javafml"
          loaderVersion="${loader_version_range}"
          license="${mod_license}"
          [[mods]]
          modId="${mod_id}"
          version="${mod_version}"
          displayName="마을 지키기"
          authors="문승준 프로젝트"
          description='''마을 초소를 준비하고 밤의 3차 공세와 보스를 막는 첫 플레이 알파입니다.'''
          [[dependencies.${mod_id}]]
          modId="neoforge"
          type="required"
          versionRange="${neo_version_range}"
          ordering="NONE"
          side="BOTH"
          [[dependencies.${mod_id}]]
          modId="minecraft"
          type="required"
          versionRange="${minecraft_version_range}"
          ordering="NONE"
          side="BOTH"
          EOF

          cat > vg-build/src/main/java/kr/moonseungjun/villageguardians/VillageGuardians.java <<'EOF'
          package kr.moonseungjun.villageguardians;
          import com.mojang.logging.LogUtils;
          import net.neoforged.fml.common.Mod;
          import org.slf4j.Logger;
          @Mod(VillageGuardians.MOD_ID)
          public final class VillageGuardians {
              public static final String MOD_ID = "villageguardians";
              private static final Logger LOGGER = LogUtils.getLogger();
              public VillageGuardians() {
                  LOGGER.info("Village Guardians 26.2 v0.8.0 First Playable Alpha loaded");
              }
          }
          EOF

          cat > vg-build/src/main/resources/data/minecraft/tags/function/load.json <<'EOF'
          {"values":["villageguardians:load"]}
          EOF
          cat > vg-build/src/main/resources/data/minecraft/tags/function/tick.json <<'EOF'
          {"values":["villageguardians:tick"]}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/load.mcfunction <<'EOF'
          scoreboard objectives add vg_global dummy
          scoreboard objectives add vg_start trigger
          scoreboard objectives add vg_menu trigger
          execute unless score $state vg_global matches 0.. run scoreboard players set $state vg_global 0
          execute unless score $timer vg_global matches 0.. run scoreboard players set $timer vg_global 0
          execute unless score $day vg_global matches 1.. run scoreboard players set $day vg_global 1
          execute unless score $wins vg_global matches 0.. run scoreboard players set $wins vg_global 0
          execute unless score $built vg_global matches 0.. run scoreboard players set $built vg_global 0
          execute unless score $boss vg_global matches 0.. run scoreboard players set $boss vg_global 0
          tellraw @a {"text":"[마을 지키기] 알파가 로드되었습니다. /trigger vg_menu 로 안내를 확인하세요.","color":"gold"}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/tick.mcfunction <<'EOF'
          scoreboard players enable @a vg_start
          scoreboard players enable @a vg_menu
          execute as @a[tag=!vg_joined] run function villageguardians:first_join
          execute as @a[scores={vg_menu=1..}] run function villageguardians:menu
          execute as @a[scores={vg_start=1..}] if score $state vg_global matches 0 run function villageguardians:start
          scoreboard players set @a[scores={vg_menu=1..}] vg_menu 0
          scoreboard players set @a[scores={vg_start=1..}] vg_start 0
          execute if score $state vg_global matches 1 run function villageguardians:invasion_tick
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/first_join.mcfunction <<'EOF'
          tag @s add vg_joined
          execute if score $built vg_global matches 0 run function villageguardians:build_outpost
          give @s minecraft:iron_sword 1
          give @s minecraft:shield 1
          give @s minecraft:bow 1
          give @s minecraft:arrow 64
          give @s minecraft:bread 32
          tellraw @s {"text":"[마을 지키기] 장비 지급 완료. 정비 후 /trigger vg_start 를 입력하면 밤 공세가 시작됩니다.","color":"yellow"}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/build_outpost.mcfunction <<'EOF'
          scoreboard players set $built vg_global 1
          gamerule doDaylightCycle false
          gamerule doWeatherCycle false
          time set day
          weather clear
          fill ~-10 ~-1 ~-10 ~10 ~-1 ~10 minecraft:stone_bricks
          fill ~-10 ~ ~-10 ~10 ~5 ~10 minecraft:air
          fill ~-10 ~ ~-10 ~10 ~2 ~-10 minecraft:cobblestone
          fill ~-10 ~ ~10 ~10 ~2 ~10 minecraft:cobblestone
          fill ~-10 ~ ~-10 ~-10 ~2 ~10 minecraft:cobblestone
          fill ~10 ~ ~-10 ~10 ~2 ~10 minecraft:cobblestone
          fill ~-2 ~ ~-10 ~2 ~2 ~-10 minecraft:air
          fill ~-2 ~ ~10 ~2 ~2 ~10 minecraft:air
          fill ~-2 ~ ~-2 ~2 ~3 ~2 minecraft:oak_planks
          fill ~-1 ~ ~-1 ~1 ~2 ~1 minecraft:air
          setblock ~ ~ ~ minecraft:campfire
          setblock ~-6 ~ ~-6 minecraft:chest
          setblock ~6 ~ ~6 minecraft:crafting_table
          summon minecraft:villager ~3 ~ ~3
          tag @e[type=minecraft:villager,sort=nearest,limit=1,distance=..4,tag=!vg_villager] add vg_villager
          summon minecraft:villager ~-3 ~ ~3
          tag @e[type=minecraft:villager,sort=nearest,limit=1,distance=..4,tag=!vg_villager] add vg_villager
          summon minecraft:villager ~3 ~ ~-3
          tag @e[type=minecraft:villager,sort=nearest,limit=1,distance=..4,tag=!vg_villager] add vg_villager
          summon minecraft:iron_golem ~ ~ ~5
          tag @e[type=minecraft:iron_golem,sort=nearest,limit=1,distance=..6,tag=!vg_guard] add vg_guard
          setworldspawn ~ ~ ~
          tellraw @a {"text":"[마을 지키기] 첫 마을 초소가 생성되었습니다.","color":"green"}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/menu.mcfunction <<'EOF'
          tellraw @s {"text":"===== 마을 지키기 첫 플레이 알파 =====","color":"gold"}
          tellraw @s {"text":"정비 단계: 장비와 초소를 확인한 뒤 /trigger vg_start","color":"yellow"}
          tellraw @s {"text":"밤 전투: 좀비·스켈레톤 3차 공세 후 성문파쇄자(약탈수)가 출현합니다.","color":"white"}
          tellraw @s {"text":"승리하면 에메랄드·철·식량을 받고 다음 날로 진행합니다.","color":"green"}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/start.mcfunction <<'EOF'
          kill @e[tag=vg_enemy]
          scoreboard players set $state vg_global 1
          scoreboard players set $timer vg_global 0
          scoreboard players set $boss vg_global 0
          time set midnight
          weather clear
          title @a title {"text":"침공 시작","color":"red","bold":true}
          tellraw @a {"text":"[마을 지키기] 3차 공세를 막아내세요!","color":"red"}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/invasion_tick.mcfunction <<'EOF'
          scoreboard players add $timer vg_global 1
          execute if score $timer vg_global matches 40 run function villageguardians:wave1
          execute if score $timer vg_global matches 500 run function villageguardians:wave2
          execute if score $timer vg_global matches 1000 run function villageguardians:wave3
          execute if score $timer vg_global matches 1500 run function villageguardians:boss
          execute if score $boss vg_global matches 1 unless entity @e[tag=vg_boss] run function villageguardians:victory
          execute if score $timer vg_global matches 3600.. run function villageguardians:victory
          execute unless entity @e[tag=vg_villager] run function villageguardians:defeat
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/wave1.mcfunction <<'EOF'
          tellraw @a {"text":"[1차 공세] 북문 돌격대가 접근합니다.","color":"yellow"}
          execute at @a[limit=1,sort=random] run summon minecraft:zombie ~15 ~ ~ {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:zombie ~17 ~ ~2 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:zombie ~-15 ~ ~ {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:skeleton ~-17 ~ ~2 {Tags:["vg_enemy"]}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/wave2.mcfunction <<'EOF'
          tellraw @a {"text":"[2차 공세] 양문에서 원거리 병력이 합류합니다.","color":"gold"}
          execute at @a[limit=1,sort=random] run summon minecraft:zombie ~16 ~ ~5 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:husk ~18 ~ ~-4 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:skeleton ~-16 ~ ~5 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:skeleton ~-18 ~ ~-4 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:zombie ~ ~ ~18 {Tags:["vg_enemy"]}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/wave3.mcfunction <<'EOF'
          tellraw @a {"text":"[3차 공세] 정예 돌격대입니다. 보스 출현이 임박했습니다.","color":"red"}
          execute at @a[limit=1,sort=random] run summon minecraft:husk ~15 ~ ~5 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:husk ~15 ~ ~-5 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:zombie ~-15 ~ ~5 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:zombie ~-15 ~ ~-5 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:skeleton ~5 ~ ~15 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:skeleton ~-5 ~ ~-15 {Tags:["vg_enemy"]}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/boss.mcfunction <<'EOF'
          scoreboard players set $boss vg_global 1
          title @a title {"text":"성문파쇄자 출현","color":"dark_red","bold":true}
          execute at @a[limit=1,sort=random] run summon minecraft:ravager ~20 ~ ~ {Tags:["vg_enemy","vg_boss"]}
          execute at @a[limit=1,sort=random] run summon minecraft:pillager ~18 ~ ~3 {Tags:["vg_enemy"]}
          execute at @a[limit=1,sort=random] run summon minecraft:pillager ~18 ~ ~-3 {Tags:["vg_enemy"]}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/victory.mcfunction <<'EOF'
          scoreboard players set $state vg_global 0
          scoreboard players set $timer vg_global 0
          scoreboard players set $boss vg_global 0
          scoreboard players add $day vg_global 1
          scoreboard players add $wins vg_global 1
          kill @e[tag=vg_enemy]
          time set day
          give @a minecraft:emerald 5
          give @a minecraft:iron_ingot 8
          give @a minecraft:bread 16
          title @a title {"text":"마을 방어 성공","color":"green","bold":true}
          tellraw @a {"text":"[정산] 보상이 지급되었습니다. 다시 준비한 뒤 /trigger vg_start","color":"green"}
          EOF

          cat > vg-build/src/main/resources/data/villageguardians/function/defeat.mcfunction <<'EOF'
          scoreboard players set $state vg_global 0
          scoreboard players set $timer vg_global 0
          scoreboard players set $boss vg_global 0
          kill @e[tag=vg_enemy]
          time set day
          execute at @a[limit=1] run summon minecraft:villager ~2 ~ ~2
          execute at @a[limit=1] run tag @e[type=minecraft:villager,sort=nearest,limit=1,distance=..4,tag=!vg_villager] add vg_villager
          title @a title {"text":"마을 방어 실패","color":"dark_red","bold":true}
          tellraw @a {"text":"[패배] 주민 한 명이 구조되었습니다. 정비 후 다시 도전하세요.","color":"red"}
          EOF

      - name: Compile and capture log
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd vg-build
          gradle --no-daemon --stacktrace --console=plain clean build > "$GITHUB_WORKSPACE/build.log" 2>&1
          CODE=$?
          echo "$CODE" > "$GITHUB_WORKSPACE/build.exit"
          cat "$GITHUB_WORKSPACE/build.log"
          exit "$CODE"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vg-diagnostics
          path: |
            build.log
            build.exit
          if-no-files-found: warn

      - name: Collect distributable JAR
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifact
          JAR="$(find vg-build/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" artifact/VillageGuardians-26.2-v0.8.0-alpha.1.jar
          sha256sum artifact/VillageGuardians-26.2-v0.8.0-alpha.1.jar > artifact/VillageGuardians-26.2-v0.8.0-alpha.1.jar.sha256

      - name: Upload JAR
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VillageGuardians-26.2-v0.8.0-alpha.1
          path: artifact/*
          if-no-files-found: error

      - name: Fail when compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1
