name: Village Guardians CI probe

on:
  push:
    branches:
      - build/village-guardians-ci-probe
  pull_request:
    branches:
      - main

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          java -version
          echo ok > probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vg-probe
          path: probe.txt
